<footer class="mt-16 border-t border-darkmode-border bg-darkmode-light">
  <div class="container">
    <div class="row items-center py-10">
      <div class="lg:col-3 mb-8 text-center lg:mb-0 lg:text-left">
        <a
          class="navbar-brand inline-flex items-center gap-2.5"
          href="{{ site.Home.RelPermalink }}">
          <img
            src="{{ `logo.png` | relURL }}"
            alt=""
            width="30"
            height="33"
            class="h-8 w-auto" />
          <span class="font-secondary text-xl font-bold">{{ site.Title }}</span>
        </a>
      </div>
      <div class="lg:col-6 mb-8 text-center lg:mb-0">
        <ul>
          {{ range site.Menus.footer }}
            <li class="m-3 inline-block">
              <a
                class="hover:text-darkmode-primary"
                {{ if findRE `^http` .URL }}target="_blank" rel="noopener"{{ end }}
                href="{{ .URL | relLangURL }}"
                >{{ .Name }}</a
              >
            </li>
          {{ end }}
        </ul>
      </div>
      <div class="lg:col-3 text-center lg:text-right">
        <ul class="social-icons">
          {{ range hugo.Data.social.main }}
            <li>
              <a
                target="_blank"
                aria-label="{{ .name }}"
                rel="nofollow noopener"
                href="{{ .link | safeURL }}">
                <i class="{{ .icon }}"></i>
              </a>
            </li>
          {{ end }}
        </ul>
      </div>
    </div>
  </div>
  <div class="border-t border-darkmode-border py-6">
    <div class="container text-center text-darkmode-text-light">
      <p>© {{ now.Year }} {{ site.Title }}</p>
    </div>
  </div>
</footer>
