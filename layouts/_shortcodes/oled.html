{{ $src := .Get "src" }}
{{ $caption := .Get "caption" }}
<figure class="not-prose my-6" style="max-width:512px;">
  <div style="aspect-ratio:2/1;width:100%;background:#000;border:2px dashed #555;border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden;">
    {{ with $src }}
      <img src="{{ . | relURL }}" alt="{{ $caption }}" style="width:100%;height:100%;image-rendering:pixelated;" />
    {{ else }}
      <span style="color:#666;font-family:monospace;font-size:0.85rem;">128 × 64</span>
    {{ end }}
  </div>
  {{ with $caption }}<figcaption style="margin-top:0.5rem;font-size:0.85rem;opacity:0.7;">{{ . }}</figcaption>{{ end }}
</figure>
